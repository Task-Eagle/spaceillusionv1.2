<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashing Through Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * 2;
                this.y = (Math.random() - 0.5) * 2;
                this.z = Math.random() * 2 + 0.5;
                this.pz = this.z;
                this.size = 0;
                this.trail = [];
                this.maxTrailLength = 5;
            }

            update(speed) {
                this.z -= speed;

                if (this.z <= 0) {
                    this.reset();
                    this.z = 2;
                    this.pz = this.z;
                }

                this.trail.push({
                    x: (this.x / this.pz) * 100 + centerX,
                    y: (this.y / this.pz) * 100 + centerY,
                    size: (1 / this.pz) * 3
                });

                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }

                this.pz = this.z;
            }

            show() {
                const sx = (this.x / this.z) * 100 + centerX;
                const sy = (this.y / this.z) * 100 + centerY;
                this.size = (1 / this.z) * 3;

                const alpha = Math.min(1, (2 - this.z));

                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        const prev = this.trail[i - 1];
                        const curr = this.trail[i];

                        const trailAlpha = (i / this.trail.length) * alpha * 0.6;

                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(255, 255, 255, ${trailAlpha})`;
                        ctx.lineWidth = curr.size * 0.8;
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(curr.x, curr.y);
                        ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.arc(sx, sy, this.size, 0, Math.PI * 2);
                ctx.fill();

                if (sx < 0 || sx > width || sy < 0 || sy > height) {
                    this.reset();
                    this.z = 2;
                    this.pz = this.z;
                    this.trail = [];
                }
            }
        }

        const stars = [];
        const numStars = 150;
        const speed = 0.03;

        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            for (const star of stars) {
                star.update(speed);
                star.show();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
